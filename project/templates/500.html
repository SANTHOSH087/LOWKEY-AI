<!DOCTYPE html>
<html lang="en" data-theme="lavender">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong — Lowkey AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
  <h1 style="font-family:var(--font-display);font-size:44px;">{{ code or 500 }}</h1>
  <p style="color:var(--muted);margin:10px 0 20px;max-width:380px;">{{ override_message or "Something went wrong on our end. It's been logged — try again in a moment." }}</p>
  <a href="/" class="btn btn-primary">Go home</a>
</div>
</body>
</html>
